/* ===== GIANT COFFEE PREP — the runsheet turned into software ===== */
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
/* Stop iOS double-tap zoom (e.g. "66" on the alarm keypad). Pinch zoom still works. */
html,body,button,a,input,select,textarea,label,.gate,.gate .pad{touch-action:manipulation}
:root{
  --green:#008645; --green-d:#006634; --cream:#F5F2EC; --stone:#ECE8E1;
  --espresso:#241F1B; --sage:#DCE7D7; --orange:#E8632B; --line:#D7D1C7;
  --mute:#8B847A; --bg:#FDFCFA; --nav:72px;
  --display:"Saira Condensed",Arial Narrow,sans-serif;
  --body:"Schibsted Grotesk",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--body);background:var(--bg);color:var(--espresso);font-size:16px;line-height:1.35;
  padding-bottom:calc(var(--nav) + env(safe-area-inset-bottom));overscroll-behavior-y:none}
button,input,textarea,select{font:inherit;color:inherit}
button{background:none;border:none;cursor:pointer}
.wrap{max-width:720px;width:100%;margin:0 auto;padding:0 16px}
h1,h2,h3{font-family:var(--display);font-weight:900;text-transform:uppercase;line-height:.98;letter-spacing:.01em}

/* ---------- top bar ---------- */
.top{background:var(--green);color:var(--cream);padding:calc(14px + env(safe-area-inset-top)) 16px 14px;
  position:sticky;top:0;z-index:40}
.top .inner{max-width:720px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
.top .brand{font-family:var(--display);font-weight:900;font-size:15px;letter-spacing:.18em;text-transform:uppercase;opacity:.78}
.top h1{font-size:27px;margin-top:2px}
.top .meta{text-align:right;font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;opacity:.85}
.top .meta b{display:block;font-family:var(--display);font-size:21px;font-weight:900;letter-spacing:.02em;opacity:1}

/* ---------- section heads ---------- */
.zone{display:flex;align-items:center;gap:10px;margin:26px 0 10px}
.zone span{font-family:var(--display);font-weight:900;font-size:18px;text-transform:uppercase;letter-spacing:.13em;color:var(--green);white-space:nowrap}
.zone em{font-style:normal;font-size:10px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--mute)}
.zone:after{content:"";flex:1;height:2px;background:var(--green);opacity:.25}

/* ---------- cards ---------- */
.card{background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:14px}
.card+.card{margin-top:10px}

/* ---------- big buttons ---------- */
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:60px;
  border-radius:10px;font-family:var(--display);font-weight:900;font-size:21px;text-transform:uppercase;
  letter-spacing:.1em;background:var(--green);color:#fff;border:2px solid var(--green);transition:transform .08s}
.btn:active{transform:scale(.985)}
.btn.alt{background:#fff;color:var(--espresso);border-color:var(--espresso)}
.btn.dark{background:var(--espresso);border-color:var(--espresso);color:var(--cream)}
.btn.warn{background:var(--orange);border-color:var(--orange)}
.btn.sm{min-height:46px;font-size:15px;letter-spacing:.08em;border-radius:8px}
.btn[disabled]{opacity:.4}

/* ---------- NEXT UP sticky ---------- */
.nextup{position:sticky;top:calc(78px + env(safe-area-inset-top));z-index:30;margin:14px 0 4px;
  background:var(--espresso);color:var(--cream);border-radius:10px;padding:12px 14px;
  display:flex;align-items:center;gap:12px;box-shadow:0 6px 18px rgba(36,31,27,.16)}
.nextup .k{font-family:var(--display);font-weight:900;font-size:12px;letter-spacing:.2em;color:#7FD6A5;text-transform:uppercase}
.nextup .t{font-family:var(--display);font-weight:900;font-size:20px;text-transform:uppercase;line-height:1.02;margin-top:2px}
.nextup .when{margin-left:auto;text-align:right;font-family:var(--display);font-weight:900;font-size:22px;color:#7FD6A5;white-space:nowrap}
.nextup.done{background:var(--green)}
.nextup.done .k,.nextup.done .when{color:var(--cream)}

/* ---------- task row ---------- */
.task{display:flex;gap:12px;background:#fff;border:1.5px solid var(--line);border-radius:10px;
  padding:12px;margin-top:8px;align-items:flex-start;transition:opacity .2s,background .2s}
.task.prio{border-color:var(--orange);background:#FDF3EE}
.task.next{border-color:var(--green);border-width:2.5px;box-shadow:0 3px 12px rgba(0,134,69,.14)}
.task.done{opacity:.5;background:#F7F5F1}
.task.done .tt{text-decoration:line-through;text-decoration-thickness:1.5px}
.tick{flex:0 0 auto;width:44px;height:44px;border:2.5px solid var(--espresso);border-radius:8px;
  display:flex;align-items:center;justify-content:center;background:#fff}
.tick svg{width:26px;height:26px;opacity:0;transform:scale(.6);transition:.14s}
.task.done .tick{background:var(--green);border-color:var(--green)}
.task.done .tick svg{opacity:1;transform:scale(1)}
.task.prio .tick{border-color:var(--orange)}
.tbody{flex:1;min-width:0}
.trail{font-family:var(--display);font-weight:900;font-size:15px;letter-spacing:.09em;text-transform:uppercase;color:var(--green)}
.task.prio .trail{color:var(--orange)}
.tt{font-weight:700;font-size:16px;line-height:1.25;margin-top:1px}
.td{font-size:13.5px;color:#5A524A;margin-top:3px}
.tmeta{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;align-items:center}
.chip{font-family:var(--display);font-weight:900;font-size:14px;text-transform:uppercase;letter-spacing:.05em;
  background:var(--sage);padding:4px 9px;border-radius:6px;white-space:nowrap}
.chip.qty{background:var(--stone);font-family:var(--body);font-weight:700;font-size:13px;letter-spacing:.01em;text-transform:none}
.chip.loc{background:#fff;color:var(--green);border:2px solid var(--green)}
.chip.code{background:var(--espresso);color:var(--cream)}
.chip.code b{color:#7FD6A5;font-size:16px}
.chip.at{background:none;color:var(--mute);padding:4px 0;font-family:var(--body);font-weight:700;font-size:11px;letter-spacing:.12em}
.tact{display:flex;gap:8px;margin-top:9px;flex-wrap:wrap}
.tact .btn{width:auto;flex:1;min-width:132px}
.subs{margin-top:10px;border-top:1.5px dashed var(--line);padding-top:9px}
.sub{display:grid;grid-template-columns:auto 1fr auto;gap:11px;align-items:center;padding:9px 0}
.sub.tub{border-left:9px solid var(--line);padding-left:11px;border-radius:5px;margin-bottom:4px}
.sub .minitick{width:38px;height:38px;border:2.5px solid var(--espresso);border-radius:8px;flex:0 0 auto;
  display:flex;align-items:center;justify-content:center;background:#fff}
.sub .minitick svg{width:23px;height:23px;opacity:0}
.sub.on .minitick{background:var(--green);border-color:var(--green)}
.sub.on .minitick svg{opacity:1}
.sbody{min-width:0}
.sub .sl{display:block;font-weight:700;font-size:15.5px;line-height:1.2}
.sub.on .sl{text-decoration:line-through;opacity:.55}
.madeon{display:inline-block;margin-top:5px;font-family:var(--display);font-weight:900;font-size:12px;
  letter-spacing:.1em;text-transform:uppercase;color:#fff;background:var(--espresso);
  padding:4px 9px;border-radius:5px;white-space:nowrap}
.sright{display:flex;flex-direction:column;align-items:flex-end;gap:5px;text-align:right}
.sub .sq{font-family:var(--display);font-weight:900;font-size:16px;color:var(--green);line-height:1.05;max-width:92px}
.sub .rlink{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  color:var(--green);border-bottom:2px solid var(--green);padding-bottom:1px}
.initbox{margin-top:9px;display:flex;align-items:center;gap:8px;border-top:1.5px dashed var(--line);padding-top:8px}
.initbox label{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--mute)}
.initbox input{width:84px;border:none;border-bottom:2px solid var(--espresso);padding:5px 2px;
  font-family:var(--display);font-weight:900;font-size:18px;text-transform:uppercase;background:none}
.initbox input:focus{outline:none;border-color:var(--green)}

/* ---------- container colour coding ---------- */
.sw{display:inline-block;width:20px;height:20px;border-radius:5px;flex:0 0 auto;
  border:2px solid rgba(36,31,27,.28);vertical-align:-4px;box-shadow:0 1px 3px rgba(36,31,27,.18)}
.sw.clear{background:repeating-linear-gradient(45deg,#fff 0 4px,#E4DFD6 4px 8px);border:2px dashed #8E867B}
.sw.lg{width:30px;height:30px;border-radius:7px}
/* filled pill in the tub colour — this is the bit that must not get lost */
.cont{display:inline-flex;align-items:center;gap:7px;font-family:var(--display);font-weight:900;
  font-size:14px;text-transform:uppercase;letter-spacing:.11em;white-space:nowrap;
  padding:5px 11px 5px 7px;border-radius:7px;color:#fff}
.cont .sw{width:15px;height:15px;border-color:rgba(255,255,255,.55);box-shadow:none}
.cont.clear{color:var(--espresso);background:#fff;border:2.5px solid var(--espresso);padding:3px 9px 3px 5px}
.cont.clear .sw{border-color:var(--espresso)}
/* big banner at the top of a recipe */
.contbar{display:flex;align-items:center;gap:14px;border-radius:10px;padding:16px 16px;margin-bottom:14px;color:#fff}
.contbar.clear{background:#fff;color:var(--espresso);border:3px solid var(--espresso)}
.contbar .k{font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;font-weight:700;opacity:.75}
.contbar .v{font-family:var(--display);font-weight:900;font-size:27px;text-transform:uppercase;letter-spacing:.05em;line-height:1;margin-top:2px}
.tgc .l .sw{margin-right:6px}
/* colour-edged cards and rows */
.rcard.tub{border-left-width:12px;border-left-style:solid}
.tgc.tub{border-left-width:10px;border-left-style:solid}
.sub.tub{border-left:8px solid var(--line);padding-left:9px;border-radius:4px;margin-bottom:2px}

/* ---------- timers ---------- */
.timerbar{position:fixed;left:0;right:0;bottom:calc(var(--nav) + env(safe-area-inset-bottom));z-index:45;
  padding:0 12px 8px;pointer-events:none}
.timerbar .inner{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:6px}
.tmr{pointer-events:auto;background:var(--espresso);color:var(--cream);border-radius:10px;padding:10px 12px;
  display:flex;align-items:center;gap:12px;box-shadow:0 6px 20px rgba(36,31,27,.3)}
.tmr .nm{min-width:0;font-family:var(--display);font-weight:900;font-size:15px;text-transform:uppercase;letter-spacing:.07em;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tmr .cd{margin-left:auto;font-family:var(--display);font-weight:900;font-size:26px;letter-spacing:.02em;
  font-variant-numeric:tabular-nums;color:#7FD6A5}
.tmr.ring{background:var(--orange);animation:pulse 1s infinite}
.tmr.ring .cd{color:#fff}
.tmr .x{width:38px;height:38px;border-radius:8px;border:2px solid rgba(245,242,236,.4);flex:0 0 auto;
  display:flex;align-items:center;justify-content:center;font-size:20px;line-height:1}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.72}}

/* ---------- targets ---------- */
.tg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tgc{min-width:0;background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:11px 12px}
.tgc.fill{background:var(--sage);border-color:#BCCFB5}
.tgc .l{font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;font-weight:700;color:#6D665E}
.tgc .v{font-family:var(--display);font-weight:900;font-size:30px;line-height:1;margin-top:3px}
.tgc .v small{font-size:14px;font-weight:700}
.tgc .act{margin-top:8px;display:flex;align-items:center;gap:6px;border-top:1.5px dashed var(--line);padding-top:7px}
.tgc .act span{font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--mute)}
.tgc .act input{flex:1;min-width:0;width:100%;max-width:100%;border:none;border-bottom:2px solid var(--line);background:none;
  font-family:var(--display);font-weight:900;font-size:19px;padding:2px;text-align:right}
.tgc .act input:focus{outline:none;border-color:var(--green)}
.tomake{margin-top:7px;background:var(--espresso);color:var(--cream);border-radius:7px;padding:7px 9px}
.tomake span{display:block;font-size:8.5px;letter-spacing:.13em;text-transform:uppercase;font-weight:700;opacity:.72}
.tomake b{display:block;font-family:var(--display);font-weight:900;font-size:21px;line-height:1;color:#7FD6A5;
  white-space:nowrap;margin-top:3px}
.tomake.done{background:var(--sage);color:#2C5A33;font-family:var(--display);font-weight:900;
  font-size:13px;text-transform:uppercase;letter-spacing:.08em;justify-content:center}
.schint{margin-top:9px;font-size:12.5px;color:#3F5B3B;line-height:1.35}
.schint b{font-weight:700}

/* ---------- progress ---------- */
.prog{background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:14px;margin-top:12px}
.prog .row{display:flex;align-items:baseline;justify-content:space-between}
.prog .lab{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;color:var(--mute)}
.prog .n{font-family:var(--display);font-weight:900;font-size:34px;line-height:1}
.prog .pc{font-family:var(--display);font-weight:900;font-size:34px;color:var(--green)}
.bar{height:12px;background:var(--stone);border-radius:6px;margin-top:10px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--green);border-radius:6px;transition:width .3s}

/* ---------- fields ---------- */
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f label{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--mute)}
.f input,.f select,.f textarea{border:1.5px solid var(--line);border-radius:8px;padding:12px;background:#fff;font-size:16px;width:100%;min-width:0;max-width:100%}
.f input:focus,.f select:focus,.f textarea:focus{outline:none;border-color:var(--green)}
.f.full{grid-column:1/-1}
textarea{min-height:120px;resize:vertical;font-family:var(--body);line-height:1.4}

/* ---------- bottom nav ---------- */
nav.bn{position:fixed;left:0;right:0;bottom:0;z-index:50;background:#fff;border-top:2px solid var(--stone);
  padding-bottom:env(safe-area-inset-bottom);display:flex}
nav.bn button{flex:1;min-width:0;padding:0 2px;height:var(--nav);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  font-family:var(--display);font-weight:900;font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
nav.bn button svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav.bn button.on{color:var(--green)}

/* ---------- screens ---------- */
.screen{display:none;padding-top:4px;padding-bottom:24px}
.screen.on{display:block}

/* ---------- spec cards ---------- */
.specs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.spc{background:var(--espresso);color:var(--cream);border-radius:10px;padding:14px}
.spc.g{background:var(--green)}
.spc .n{font-family:var(--display);font-weight:900;font-size:17px;text-transform:uppercase;letter-spacing:.09em;opacity:.85}
.spc .t{font-family:var(--display);font-weight:900;font-size:38px;line-height:1;margin-top:6px}
.spc .m{font-family:var(--display);font-weight:900;font-size:20px;opacity:.85;margin-top:2px}

/* ---------- recipe ---------- */
.rlist{display:grid;gap:8px}
.rcard .nm,.rcard .sb{min-width:0;overflow-wrap:anywhere}
.rcard{display:flex;align-items:center;gap:12px;background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:15px;width:100%;text-align:left}
.rcard .nm{font-family:var(--display);font-weight:900;font-size:21px;text-transform:uppercase;letter-spacing:.03em}
.rcard .sb{font-size:12px;color:var(--mute);margin-top:2px}
.rcard .ar{margin-left:auto;font-size:24px;color:var(--green);font-weight:700}
.ing{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1.5px solid var(--stone)}
.ing:last-child{border-bottom:none}
.ing .n{font-weight:600;font-size:16px;min-width:0}
.ing .q{font-family:var(--display);font-weight:900;font-size:25px;white-space:nowrap}
.ing .q em{font-style:normal;font-size:14px;font-weight:700;color:var(--mute);margin-left:3px}
.scaler{background:var(--sage);border-radius:10px;padding:14px;margin-bottom:12px}
.scaler .lab{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:#4A6B45}
.scaler .rowin{display:flex;align-items:center;gap:10px;margin-top:8px}
.scaler input{flex:1;min-width:0;border:2px solid #B6CBAF;border-radius:8px;padding:12px;background:#fff;
  font-family:var(--display);font-weight:900;font-size:26px;text-align:center}
.scaler input:focus{outline:none;border-color:var(--green)}
.step{width:56px;height:52px;border:2px solid #B6CBAF;border-radius:8px;background:#fff;
  font-family:var(--display);font-weight:900;font-size:26px;color:var(--green);flex:0 0 auto}
.note{background:#FDF3EE;border-left:5px solid var(--orange);border-radius:8px;padding:11px 13px;font-size:13.5px;margin-top:12px}
.note .nh{color:var(--orange);text-transform:uppercase;font-family:var(--display);font-weight:900;letter-spacing:.1em;font-size:13.5px;display:block;margin-bottom:3px}
.note b{font-weight:700}
.bignum{font-family:var(--display);font-weight:900;font-size:54px;line-height:1;color:var(--green)}

/* ---------- history ---------- */
.hrow{display:flex;align-items:center;gap:12px;background:#fff;border:1.5px solid var(--line);border-radius:10px;
  padding:14px;width:100%;text-align:left;margin-top:8px}
.hrow .d{font-family:var(--display);font-weight:900;font-size:19px;text-transform:uppercase}
.hrow .s{font-size:12.5px;color:var(--mute);margin-top:2px}
.hrow .p{margin-left:auto;font-family:var(--display);font-weight:900;font-size:24px;color:var(--green)}
.hrow .p.part{color:var(--orange)}

/* ---------- sheet / modal ---------- */
.sheet{position:fixed;inset:0;z-index:60;background:rgba(36,31,27,.5);display:none;align-items:flex-end}
.sheet.on{display:flex}
.sheet .pane{background:var(--bg);width:100%;max-height:92vh;overflow-y:auto;border-radius:16px 16px 0 0;
  padding:0 0 calc(20px + env(safe-area-inset-bottom))}
.sheet .ph{position:sticky;top:0;background:var(--bg);padding:16px;border-bottom:2px solid var(--stone);
  display:flex;align-items:center;gap:12px;z-index:2}
.sheet .ph h2{font-size:19px;flex:1;min-width:0}
.backbtn{display:inline-flex;align-items:center;gap:7px;height:44px;padding:0 15px 0 11px;border:2.5px solid var(--espresso);
  border-radius:9px;background:#fff;font-family:var(--display);font-weight:900;font-size:15px;text-transform:uppercase;
  letter-spacing:.09em;flex:0 0 auto}
.backbtn .ar{font-size:19px;line-height:1}
.backbig{margin-top:18px}
.sheet .pb{padding:16px}
.close{width:44px;height:44px;border:2px solid var(--line);border-radius:8px;font-size:22px;line-height:1;flex:0 0 auto}
.empty{text-align:center;padding:40px 16px;color:var(--mute)}
.empty .big{font-family:var(--display);font-weight:900;font-size:22px;text-transform:uppercase;letter-spacing:.1em;color:var(--line)}
.seg{display:flex;gap:6px;background:var(--stone);padding:4px;border-radius:10px;margin-bottom:12px}
.seg button{flex:1;min-width:0;padding:12px 6px;border-radius:7px;font-family:var(--display);font-weight:900;font-size:15px;
  text-transform:uppercase;letter-spacing:.06em;color:var(--mute)}
.seg button.on{background:#fff;color:var(--espresso);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.toast{position:fixed;left:16px;right:16px;bottom:calc(var(--nav) + 78px);z-index:70;background:var(--espresso);
  color:var(--cream);border-radius:10px;padding:13px 16px;font-weight:600;text-align:center;
  opacity:0;transform:translateY(10px);transition:.2s;pointer-events:none;max-width:688px;margin:0 auto}
.toast.on{opacity:1;transform:none}
.offline{background:var(--orange);color:#fff;text-align:center;font-size:11.5px;font-weight:700;
  letter-spacing:.14em;text-transform:uppercase;padding:6px;display:none}
.offline.on{display:block}
.hint{font-size:12.5px;color:var(--mute);margin-top:8px;line-height:1.4}
@media(min-width:600px){ .tg{grid-template-columns:repeat(4,1fr)} .specs{grid-template-columns:repeat(3,1fr)} }

/* ---------- shift start splash ---------- */
.splash{position:fixed;inset:0;z-index:200;background:var(--green);color:var(--cream);
  display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  padding:28px 22px calc(28px + env(safe-area-inset-bottom));animation:splashIn .45s cubic-bezier(.2,.8,.25,1)}
@keyframes splashIn{from{opacity:0;transform:scale(1.04)}to{opacity:1;transform:none}}
.splash .ele{width:108px;height:auto;opacity:0;animation:pop .55s .1s cubic-bezier(.2,1.3,.4,1) forwards}
@keyframes pop{from{opacity:0;transform:scale(.55) translateY(14px)}to{opacity:1;transform:none}}
.splash h2{font-size:46px;line-height:.92;margin-top:14px;opacity:0;animation:rise .5s .22s ease-out forwards}
.splash .when{font-family:var(--display);font-weight:900;font-size:22px;letter-spacing:.1em;color:#BFF0D4;
  margin-top:8px;opacity:0;animation:rise .5s .34s ease-out forwards}
.splash .line{width:64px;height:4px;background:rgba(245,242,236,.5);border-radius:2px;margin:20px 0 4px;
  opacity:0;animation:rise .5s .42s ease-out forwards}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.splash .mk{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:100%;max-width:440px;margin-top:18px}
.splash .mk div{background:rgba(245,242,236,.14);border-radius:9px;padding:10px 6px;opacity:0;
  animation:rise .45s ease-out forwards}
.splash .mk div:nth-child(1){animation-delay:.48s}.splash .mk div:nth-child(2){animation-delay:.56s}
.splash .mk div:nth-child(3){animation-delay:.64s}.splash .mk div:nth-child(4){animation-delay:.72s}
.splash .mk b{display:block;font-family:var(--display);font-weight:900;font-size:25px;line-height:1}
.splash .mk span{font-size:8.5px;letter-spacing:.13em;text-transform:uppercase;font-weight:700;opacity:.78}
.splash .first{margin-top:22px;font-size:13px;opacity:0;animation:rise .5s .8s ease-out forwards}
.splash .first b{font-family:var(--display);font-weight:900;font-size:21px;text-transform:uppercase;display:block;margin-top:3px}
.splash .go{margin-top:24px;width:100%;max-width:440px;min-height:62px;border-radius:11px;background:var(--cream);
  color:var(--green);border:none;font-family:var(--display);font-weight:900;font-size:22px;text-transform:uppercase;
  letter-spacing:.12em;opacity:0;animation:rise .5s .92s ease-out forwards}
.splash .ph{background:none;border:none;padding:0;position:static;display:block;margin-top:14px;
  font-family:var(--display);font-weight:900;font-size:14px;letter-spacing:.13em;text-transform:uppercase;
  color:#FFD9C7;opacity:0;animation:rise .5s .86s ease-out forwards}
/* special-day banner */
.phbanner{background:var(--orange);color:#fff;border-radius:10px;padding:13px 15px;margin-top:12px}
.phbanner .t{font-family:var(--display);font-weight:900;font-size:18px;text-transform:uppercase;letter-spacing:.1em}
.phbanner .d{font-size:13px;margin-top:3px;opacity:.95}
.task.special{border-color:var(--orange);border-width:2.5px}
.task.special .trail{color:var(--orange)}

/* ---------- alarm gate ---------- */
.gate{position:fixed;inset:0;z-index:220;background:var(--espresso);color:var(--cream);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:26px 20px calc(26px + env(safe-area-inset-bottom));animation:splashIn .3s ease-out}
.gate.arm{background:#17120F}
.gate .lock{width:52px;height:52px;stroke:#7FD6A5;fill:none;stroke-width:2.2;stroke-linecap:round}
.gate .kicker{font-family:var(--display);font-weight:900;font-size:13px;letter-spacing:.26em;
  text-transform:uppercase;color:#7FD6A5;margin-top:12px}
.gate h2{font-size:34px;line-height:.95;margin-top:6px;text-align:center}
.gate .sub{font-size:13px;opacity:.7;margin-top:9px;text-align:center;max-width:300px}
.dots{display:flex;gap:14px;margin:24px 0 6px}
.dots i{width:17px;height:17px;border-radius:50%;border:2.5px solid rgba(245,242,236,.45);display:block}
.dots i.on{background:#7FD6A5;border-color:#7FD6A5;animation:dotpop .18s ease-out}
@keyframes dotpop{from{transform:scale(.4)}to{transform:scale(1)}}
.gate.bad .dots{animation:shake .42s}
@keyframes shake{10%,90%{transform:translateX(-3px)}20%,80%{transform:translateX(6px)}
  30%,50%,70%{transform:translateX(-9px)}40%,60%{transform:translateX(9px)}}
.gate.bad .dots i{border-color:#FF8A6B}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;width:100%;max-width:330px;margin-top:20px}
.pad button{height:70px;border-radius:13px;background:rgba(245,242,236,.1);border:2px solid rgba(245,242,236,.16);
  color:var(--cream);font-family:var(--display);font-weight:900;font-size:30px;transition:transform .07s,background .12s}
.pad button:active{transform:scale(.94);background:rgba(245,242,236,.26)}
.pad button.act{font-size:14px;letter-spacing:.1em;background:none;border-color:transparent;color:rgba(245,242,236,.65)}
.gate .err{min-height:20px;margin-top:14px;font-family:var(--display);font-weight:900;font-size:14px;
  letter-spacing:.13em;text-transform:uppercase;color:#FF8A6B}
.codebox{margin-top:16px;border:2.5px dashed rgba(127,214,165,.55);border-radius:12px;padding:11px 22px;text-align:center}
.codebox .cl{font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;font-weight:700;color:rgba(245,242,236,.6)}
.codebox .cv{font-family:var(--display);font-weight:900;font-size:42px;letter-spacing:.2em;color:#7FD6A5;line-height:1.05}
.gate .shown{margin-top:10px;font-family:var(--display);font-weight:900;font-size:26px;letter-spacing:.3em;color:#7FD6A5}
/* success */
.gate.win{background:var(--green);animation:none}
.gate.win .lock,.gate.win .pad,.gate.win .err,.gate.win .codebox,.gate.win .dots,.gate.win .sub{display:none}
.gate .winwrap{display:none;flex-direction:column;align-items:center;text-align:center}
.gate.win .winwrap{display:flex;animation:pop .4s cubic-bezier(.2,1.3,.4,1)}
.gatehead{display:flex;flex-direction:column;align-items:center}
.gate.win .gatehead{display:none!important}
.winwrap svg{width:96px;height:96px;stroke:var(--cream);fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.winwrap .wt{font-family:var(--display);font-weight:900;font-size:40px;text-transform:uppercase;
  letter-spacing:.05em;margin-top:14px;line-height:1}
.winwrap .ws{font-family:var(--display);font-weight:900;font-size:18px;letter-spacing:.16em;color:#BFF0D4;margin-top:7px}

/* ---------- receipts ---------- */

<script>/* =========================================================================
   GIANT COFFEE PREP — app logic
   State is written to localStorage on every interaction. No save button.
   ========================================================================= */
(function(){
"use strict";

/* ---------- storage ---------- */
const K = { state:"giant.prep.state.v1", hist:"giant.prep.history.v1", cfg:"giant.prep.config.v1" };
function load(k, fb){ try{ const r=localStorage.getItem(k); return r?JSON.parse(r):fb; }catch(e){ return fb; } }
function save(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){ toast("Could not save to this device"); } }

/* config = SEED with manager overrides layered on top */
let CFG = (function(){
  const o = load(K.cfg, null);
  const base = JSON.parse(JSON.stringify(SEED));
  return o ? Object.assign(base, o) : base;
})();
function saveCfg(){ save(K.cfg, CFG); }

const BLANK = () => ({
  started:false, startedAt:null, date:null, staff:"", openedBy:"", checkedBy:"",
  tasks:{}, subs:{}, actuals:{}, onhand:{}, alarm:{}, notes:"", timers:[], completedAt:null, overrideReason:""
});
let S = load(K.state, null) || BLANK();
if(!S.onhand) S.onhand = {};
if(!S.alarm) S.alarm = {};
let HIST = load(K.hist, []);
function persist(){ save(K.state, S); }

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const el = (t,c,h)=>{ const n=document.createElement(t); if(c)n.className=c; if(h!=null)n.innerHTML=h; return n; };
const esc = s => String(s==null?"":s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function swatch(ct, big){ if(!ct) return "";
  const c = "sw"+(big?" lg":"")+(ct.color?"":" clear");
  return ct.color ? '<i class="'+c+'" style="background:'+ct.color+'"></i>' : '<i class="'+c+'"></i>'; }
function contChip(ct){ if(!ct) return "";
  return ct.color
    ? '<span class="cont" style="background:'+ct.color+'">'+swatch(ct)+esc(ct.name)+' tub</span>'
    : '<span class="cont clear">'+swatch(ct)+esc(ct.name)+' tub</span>'; }
function tubEdge(node, ct){ if(!ct) return; node.classList.add("tub");
  node.style.borderLeftColor = ct.color || "#8E867B"; }
const TICK = '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>';

function hhmmToMin(s){ const m=/^(\d{1,2}):(\d{2})$/.exec(s||""); return m? (+m[1])*60 + (+m[2]) : 360; }
function minToHHMM(m){ m=((Math.round(m)%1440)+1440)%1440; const h=Math.floor(m/60), n=m%60;
  const ap = h<12?"am":"pm"; let h12 = h%12; if(h12===0) h12=12;
  return h12+":"+String(n).padStart(2,"0")+" "+ap; }
function fmtClock(d){ return minToHHMM(d.getHours()*60 + d.getMinutes()); }
function fmtDate(d){ return d.toLocaleDateString(undefined,{weekday:"short",day:"numeric",month:"short"}).toUpperCase(); }
/* Parse what a person would actually write: "500g", "0.5kg", "2x250g", "2 x 250 g", "0.5" → kg */
function parseKg(str){
  if(str==null) return null;
  let s = String(str).toLowerCase().replace(/\s+/g,"").replace(/×/g,"x");
  if(!s) return null;
  const mult = s.match(/^(\d*\.?\d+)x(\d*\.?\d+)(kg|g)?$/);
  if(mult){ const n=parseFloat(mult[1]), each=parseFloat(mult[2]);
    const unit = mult[3]||"g"; const kg = unit==="kg"? each : each/1000; return n*kg; }
  const one = s.match(/^(\d*\.?\d+)(kg|g)?$/);
  if(one){ const v=parseFloat(one[1]); const unit=one[2];
    if(unit==="g") return v/1000;
    if(unit==="kg") return v;
    return v; }            /* bare number = kg, matching the target units */
  return null;
}
/* "4–5" → {lo:4,hi:5};  "3" → {lo:3,hi:3} */
function parseRange(t){
  const s = String(t||"").replace(/–|—/g,"-");
  const m = s.match(/^(\d*\.?\d+)-(\d*\.?\d+)$/);
  if(m) return { lo:parseFloat(m[1]), hi:parseFloat(m[2]) };
  const n = parseFloat(s);
  return isFinite(n) ? { lo:n, hi:n } : null;
}
function remainingFor(t){
  const r = parseRange(t.target); if(!r) return null;
  const have = parseKg(S.onhand && S.onhand[t.id]);
  if(have==null || have<=0) return { lo:r.lo, hi:r.hi, have:0, full:true };
  return { lo:Math.max(0, r.lo-have), hi:Math.max(0, r.hi-have), have, full:false };
}
function fmtRange(r){ return r.lo===r.hi ? round(r.lo) : round(r.lo)+"–"+round(r.hi); }
function num(v){ const n=parseFloat(String(v).replace(/[^0-9.\-]/g,"")); return isFinite(n)?n:null; }
function round(n){ if(n==null) return ""; const a=Math.abs(n);
  const d = a>=100?0 : a>=10?1 : a>=1?2 : 3;
  return parseFloat(n.toFixed(d)).toString(); }

let toastT;
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("on");
  clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove("on"), 2400); }

/* ---------- shift-time offsetting ---------- */
function startOffsetMin(){
  if(!S.started || !S.startedAt) return 0;
  const d = new Date(S.startedAt);
  const actual = d.getHours()*60 + d.getMinutes();
  const std = hhmmToMin(CFG.standardStart);
  return actual > std ? actual - std : 0;   // only ever shifts later, never earlier
}
function taskTimes(t){
  if(t.offset==null) return null;
  const off = startOffsetMin();
  const std = hhmmToMin(CFG.standardStart);
  const s = std + t.offset, e = t.endOffset!=null ? std + t.endOffset : null;
  return {
    standard: e!=null ? minToHHMM(s)+"–"+minToHHMM(e) : minToHHMM(s),
    today:    e!=null ? minToHHMM(s+off)+"–"+minToHHMM(e+off) : minToHHMM(s+off),
    shifted:  off>0, startMin:s+off
  };
}

/* ---------- task state ---------- */
function todayKey(){ const d = (S.started && S.date) ? new Date(S.date) : new Date();
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function specialToday(){ return (CFG.specialDays||[]).find(s=>s.date===todayKey()) || null; }
function tasks(){
  const sp = specialToday(); if(!sp || !sp.tasks || !sp.tasks.length) return CFG.tasks;
  const out = CFG.tasks.slice();
  const i = out.findIndex(t=>t.id==="s8");
  out.splice(i>=0 ? i+1 : out.length, 0, ...sp.tasks);
  return out;
}
const isDone = id => !!(S.tasks[id] && S.tasks[id].done);
function toggleTask(id){
  const cur = isDone(id);
  S.tasks[id] = cur ? { done:false, at:null, initials:(S.tasks[id]||{}).initials||"" }
                    : { done:true, at:new Date().toISOString(), initials:(S.tasks[id]||{}).initials||"" };
  persist(); renderToday();
  if(!cur){ try{ navigator.vibrate && navigator.vibrate(18); }catch(e){} }
}
function setInitials(id,v){ S.tasks[id] = Object.assign({done:false,at:null}, S.tasks[id], {initials:v}); persist(); }
function subDone(id){ const v=S.subs[id]; return v===true || (v && v.done); }
function subAt(id){ const v=S.subs[id]; return (v && v.at) ? v.at : null; }
function toggleSub(id){
  S.subs[id] = subDone(id) ? null : { done:true, at:new Date().toISOString() };
  persist(); renderToday();
  try{ navigator.vibrate && navigator.vibrate(14); }catch(e){}
}
function madeLabel(iso){ const d=new Date(iso);
  return d.toLocaleDateString(undefined,{day:"numeric",month:"short"}).toUpperCase(); }
function progress(){
  const all = tasks(); const done = all.filter(t=>isDone(t.id)).length;
  return { done, total: all.length, pct: all.length? Math.round(done/all.length*100):0 };
}
function nextTask(){ return tasks().find(t=>!isDone(t.id)) || null; }


/* =========================================================================
   PUSH NOTIFICATIONS
   Timers are mirrored into IndexedDB (a service worker cannot read
   localStorage) and a tickle is scheduled on the Worker. When it arrives the
   service worker reads IndexedDB and shows the right notification — so this
   works with the app closed and the phone locked.
   Everything below degrades silently: no service worker, no API, no problem.
   ========================================================================= */
const PUSH = {
  supported(){ return "serviceWorker" in navigator && "PushManager" in window && "Notification" in window; },
  installed(){
    return window.matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
  },
  state(){
    if(!this.supported()) return "unsupported";
    return Notification.permission;            // "default" | "granted" | "denied"
  },
  async reg(){ try{ return await navigator.serviceWorker.ready; }catch(e){ return null; } },
  async sub(){
    const r = await this.reg(); if(!r) return null;
    try{ return await r.pushManager.getSubscription(); }catch(e){ return null; }
  },
  async enable(){
    if(!this.supported()) return { ok:false, why:"unsupported" };
    let perm = Notification.permission;
    if(perm === "default") perm = await Notification.requestPermission();
    if(perm !== "granted") return { ok:false, why:perm };
    const r = await this.reg(); if(!r) return { ok:false, why:"no-sw" };
    let s = await r.pushManager.getSubscription();
    if(!s){
      try{
        s = await r.pushManager.subscribe({
          userVisibleOnly: true,
          applicationServerKey: urlB64ToU8(CFG.vapidPublicKey)
        });
      }catch(e){ return { ok:false, why:"subscribe-failed", detail:String(e&&e.message||e) }; }
    }
    try{
      await fetch("/api/subscribe", { method:"POST", headers:{"Content-Type":"application/json"},
        body: JSON.stringify({ endpoint: s.endpoint }) });
    }catch(e){ return { ok:false, why:"server-unreachable" }; }
    return { ok:true };
  },
  async schedule(t){
    await idbPut(t);
    const s = await this.sub(); if(!s) return;
    try{
      await fetch("/api/schedule", { method:"POST", headers:{"Content-Type":"application/json"},
        body: JSON.stringify({ endpoint:s.endpoint, fireAt:t.endsAt, tid:t.tid }) });
    }catch(e){}
  },
  async cancel(tid){
    await idbDel(tid);
    const s = await this.sub(); if(!s) return;
    try{
      await fetch("/api/cancel", { method:"POST", headers:{"Content-Type":"application/json"},
        body: JSON.stringify({ endpoint:s.endpoint, tid }) });
    }catch(e){}
  }
};
function urlB64ToU8(s){
  const pad = "=".repeat((4 - s.length % 4) % 4);
  const b = atob((s + pad).replace(/-/g,"+").replace(/_/g,"/"));
  const out = new Uint8Array(b.length);
  for(let i=0;i<b.length;i++) out[i] = b.charCodeAt(i);
  return out;
}
/* ---------- tiny IndexedDB mirror ---------- */
function idb(){
  return new Promise((res,rej)=>{
    if(!("indexedDB" in window)) return rej(new Error("no idb"));
    const r = indexedDB.open("giant-prep",1);
    r.onupgradeneeded = ()=>{ if(!r.result.objectStoreNames.contains("timers")) r.result.createObjectStore("timers",{keyPath:"tid"}); };
    r.onsuccess = ()=>res(r.result); r.onerror = ()=>rej(r.error);
  });
}
function idbPut(t){ return idb().then(d=>new Promise(res=>{
  const tx = d.transaction("timers","readwrite");
  tx.objectStore("timers").put({ tid:t.tid, label:t.label, minutes:t.minutes, endsAt:t.endsAt });
  tx.oncomplete=res; tx.onerror=res; })).catch(()=>{}); }
function idbDel(tid){ return idb().then(d=>new Promise(res=>{
  const tx = d.transaction("timers","readwrite"); tx.objectStore("timers").delete(tid);
  tx.oncomplete=res; tx.onerror=res; })).catch(()=>{}); }

/* ---------- the card / row people actually tap ---------- */
function pushCard(){
  const st = PUSH.state();
  if(st === "granted" || st === "unsupported") return null;
  const c = el("div","note");
  if(!PUSH.installed()){
    c.innerHTML = '<span class="nh">Timer alerts</span>To get a buzz when a bake finishes while your phone is '+
      'locked, add this to your home screen first — Share &rarr; <b>Add to Home Screen</b> — then turn alerts on from the Guide tab.';
    return c;
  }
  c.innerHTML = '<span class="nh">Timer alerts are off</span>Turn them on and a finished bake will reach you with the app closed.';
  const b = el("button","btn sm","Turn on timer alerts");
  b.style.marginTop = "10px";
  b.onclick = async ()=>{
    b.disabled = true; b.textContent = "Asking…";
    const r = await PUSH.enable();
    b.disabled = false;
    if(r.ok){ toast("Timer alerts on"); renderToday(); renderGuide(); }
    else if(r.why === "denied"){ toast("Blocked in iPhone Settings → Notifications"); }
    else if(r.why === "server-unreachable"){ toast("Can't reach the server — try again on the live site"); }
    else { toast("Couldn't turn alerts on"); }
    b.textContent = "Turn on timer alerts";
  };
  c.appendChild(b);
  return c;
}

/* =========================================================================
   TIMERS  — endsAt is an absolute timestamp so they survive reload/navigation
   ========================================================================= */
function startTimer(taskId, label, minutes){
  const t = { tid: "t"+Date.now()+Math.random().toString(36).slice(2,6),
              taskId, label, minutes, endsAt: Date.now()+minutes*60000, acked:false };
  S.timers.push(t);
  persist(); renderTimers(); toast(minutes+" min timer started");
  PUSH.schedule(t);
}
function stopTimer(tid){ S.timers = S.timers.filter(t=>t.tid!==tid); persist(); renderTimers(); renderToday(); PUSH.cancel(tid); }
function renderTimers(){
  const bar = $("#timerBar"); bar.innerHTML="";
  S.timers.forEach(t=>{
    const left = t.endsAt - Date.now();
    const ring = left<=0;
    const n = el("div","tmr"+(ring?" ring":""));
    const mm = Math.max(0,Math.floor(Math.abs(left)/60000));
    const ss = Math.max(0,Math.floor((Math.abs(left)%60000)/1000));
    n.innerHTML = '<div class="nm">'+esc(t.label)+(ring?' — DONE':'')+'</div>'+
                  '<div class="cd">'+(ring?"00:00":String(mm).padStart(2,"0")+":"+String(ss).padStart(2,"0"))+'</div>';
    const x = el("button","x","&times;"); x.setAttribute("aria-label","Dismiss timer");
    x.onclick = ()=> stopTimer(t.tid);
    n.appendChild(x); bar.appendChild(n);
    if(ring && !t.acked){ t.acked=true; persist(); alarm(t.label); }
  });
}
function alarm(label){
  try{ navigator.vibrate && navigator.vibrate([300,120,300,120,500]); }catch(e){}
  try{
    const C = window.AudioContext||window.webkitAudioContext; if(!C) return;
    const ctx = new C();
    [0,0.42,0.84].forEach(t0=>{
      const o=ctx.createOscillator(), g=ctx.createGain();
      o.type="square"; o.frequency.value=880;
      g.gain.setValueAtTime(0.0001, ctx.currentTime+t0);
      g.gain.exponentialRampToValueAtTime(0.28, ctx.currentTime+t0+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime+t0+0.32);
      o.connect(g); g.connect(ctx.destination); o.start(ctx.currentTime+t0); o.stop(ctx.currentTime+t0+0.34);
    });
  }catch(e){}
  toast(label+" — timer finished. Confirm the task yourself.");
}
setInterval(renderTimers, 1000);

    nu.innerHTML = '<div><div class="k">Next up</div><div class="t">'+esc(nt.title)+'</div></div>'+

    nu.onclick = ()=>{ const n=document.getElementById("task-"+nt.id); if(n) n.scrollIntoView({behavior:"smooth",block:"center"}); };

  /* who */
  const who = el("div","card");

  who.innerHTML = '<div class="fgrid" style="margin-top:0">'+

    fieldHTML("Opened by","openedBy",S.openedBy)+
    fieldHTML("Checked by","checkedBy",S.checkedBy)+
    '<div class="f"><label>Shift start</label><input value="'+esc(minToHHMM(new Date(S.startedAt).getHours()*60+new Date(S.startedAt).getMinutes()))+'" disabled></div>'+
    '</div>';

  });

    const c = el("div","tgc"+(t.group==="bake"?" fill":""));
    if(t.group==="cc") tubEdge(c, t.container);
    let h = '<div class="l">'+swatch(t.container)+esc(t.name)+'</div><div class="v">'+esc(t.target)+
      (t.unit?' <small>'+esc(t.unit.toUpperCase())+'</small>':'')+'</div>';

function fieldHTML(label,key,val){
  return '<div class="f"><label>'+esc(label)+'</label><input data-k="'+key+'" value="'+esc(val||"")+'" placeholder="—"></div>';
}
function zone(parent,label,hint){
  const z = el("div","zone"); z.innerHTML = '<span>'+esc(label)+'</span>'+(hint?'<em>'+esc(hint)+'</em>':'');
  parent.appendChild(z);
}

function renderStartScreen(b){
  const c = el("div","card"); c.style.marginTop="16px";
  c.innerHTML = '<div class="zone" style="margin-top:0"><span>Start a shift</span></div>'+
    '<div class="fgrid">'+fieldHTML("Staff member","staff",S.staff)+fieldHTML("Opened by","openedBy",S.openedBy)+'</div>'+
    '<div class="hint">Standard start is '+esc(minToHHMM(hhmmToMin(CFG.standardStart)))+
    '. If you start later, every scheduled time shifts by the same amount automatically.</div>';

  c.querySelectorAll("input[data-k]").forEach(i=>{ i.oninput=()=>{ S[i.dataset.k]=i.value; persist(); }; });

  go.onclick = ()=>{
    const keepStaff = S.staff, keepOpener = S.openedBy;
    alarmGate("off", (at)=>{
      S = Object.assign(BLANK(), { started:true, startedAt:new Date().toISOString(), date:new Date().toISOString(),
                                   staff:keepStaff, openedBy:keepOpener, alarm:{ offAt: at.toISOString() } });

function renderPhase(b, phase, label, hint){
  zone(b,label,hint);
  const list = tasks().filter(t=>t.phase===phase);
  const nt = nextTask();
  list.forEach(t=>{
    const done = isDone(t.id);
    const node = el("div","task"+(done?" done":"")+(t.priority&&!done?" prio":"")+(t.special&&!done?" special":"")+(nt&&nt.id===t.id?" next":""));
    node.id = "task-"+t.id;

    const tick = el("button","tick",TICK);
    tick.setAttribute("aria-label", done?"Mark not done":"Mark done");
    tick.onclick = ()=> toggleTask(t.id);
    node.appendChild(tick);

    const body = el("div","tbody");
    const tt = taskTimes(t);
    const rail = tt ? tt.today : (t.rail||"");
    let h = "";
    if(rail) h += '<div class="trail">'+esc(rail)+'</div>';
    h += '<div class="tt">'+esc(t.title)+'</div>';
    if(t.detail) h += '<div class="td">'+esc(t.detail)+'</div>';

    let meta = "";
    if(t.qty)  meta += '<span class="chip qty">'+esc(t.qty)+'</span>';
    if(t.spec) meta += '<span class="chip">'+esc(t.spec)+'</span>';
    if(t.loc)  meta += '<span class="chip loc">'+esc(t.loc)+'</span>';
    if(t.chip && t.chip.kind==="code"){
      const stamp = /off/i.test(t.chip.label) ? (S.alarm&&S.alarm.offAt) : (S.alarm&&S.alarm.setAt);
      meta += stamp
        ? '<span class="chip code">'+esc(t.chip.label)+' <b>&#10003;</b> '+esc(fmtClock(new Date(stamp)))+'</span>'
        : '<span class="chip code">'+esc(t.chip.label)+' <b>'+esc(CFG.alarmCode)+'</b></span>';
    }
    if(tt && tt.shifted) meta += '<span class="chip at">Standard '+esc(tt.standard)+'</span>';
    if(done && S.tasks[t.id].at) meta += '<span class="chip at">Done '+esc(fmtClock(new Date(S.tasks[t.id].at)))+'</span>';
    if(meta) h += '<div class="tmeta">'+meta+'</div>';
    body.innerHTML = h;

    /* sub-ticks */
    if(t.subs){
      const sw = el("div","subs");
      t.subs.forEach(s=>{
        const on = subDone(s.id);
        const r = el("div","sub"+(on?" on":""));
        tubEdge(r, s.container);
        const made = (s.recipe && on && subAt(s.id))
          ? '<span class="madeon">Made '+esc(madeLabel(subAt(s.id)))+'</span>' : '';
        let qtyTxt = s.qty;
        if(s.recipe && !on){
          const tg = CFG.targets.find(x=>x.recipe===s.recipe);
          if(tg){ const rem = remainingFor(tg);
            if(rem && !rem.full) qtyTxt = (rem.hi<=0 ? "none needed" : fmtRange(rem)+" kg left"); }
        }
        r.innerHTML =
          '<span class="minitick">'+TICK+'</span>'+
          '<span class="sbody"><span class="sl">'+swatch(s.container)+(s.container?' ':'')+esc(s.label)+'</span>'+made+'</span>'+
          '<span class="sright"><span class="sq">'+esc(qtyTxt)+'</span></span>';
        r.querySelector(".minitick").onclick = ()=> toggleSub(s.id);
        r.querySelector(".sl").onclick = ()=> toggleSub(s.id);
        if(s.recipe){
          const lk = el("button","rlink","Recipe");
          lk.onclick = e=>{ e.stopPropagation(); openRecipe(s.recipe); };
          r.querySelector(".sright").appendChild(lk);
        }
        sw.appendChild(r);
      });
      body.appendChild(sw);
    }

    /* actions */
    const acts = el("div","tact");
    if(t.timerMin){
      const running = S.timers.find(x=>x.taskId===t.id);
      const tb = el("button","btn sm alt", running ? "Timer running" : "Start "+t.timerMin+" min timer");
      if(running) tb.disabled = true;
      else tb.onclick = ()=> startTimer(t.id, t.timerLabel||t.title, t.timerMin);
      acts.appendChild(tb);
    }
    if(t.recipeLink==="all"){ const r=el("button","btn sm alt","View recipes"); r.onclick=()=>{ go("recipes"); }; acts.appendChild(r); }
    if(t.calcLink==="cheesecake"){ const r=el("button","btn sm alt","Cheesecake calc"); r.onclick=()=>{ go("calc"); setTimeout(()=>selectCalc("cheesecake"),40); }; acts.appendChild(r); }
    if(t.calcLink==="cookieball"){ const r=el("button","btn sm alt","Cookie ball calc"); r.onclick=()=>{ go("calc"); setTimeout(()=>selectCalc("cookieball"),40); }; acts.appendChild(r); }
    if(acts.children.length) body.appendChild(acts);

    /* initials — only once the task is ticked, so untouched cards stay short */
    if(done){
      const ib = el("div","initbox");
      ib.innerHTML = '<label>Initials</label><input maxlength="4" placeholder="—" value="'+esc((S.tasks[t.id]||{}).initials||"")+'">';
      ib.querySelector("input").oninput = e=> setInitials(t.id, e.target.value.toUpperCase());
      body.appendChild(ib);
    }

    node.appendChild(body);
    b.appendChild(node);
  });
}

/* ---------- complete shift ---------- */
function tryComplete(){
  const open = tasks().filter(t=>t.mandatory && !isDone(t.id));
  if(open.length){
    openSheet(open.length+" task"+(open.length>1?"s":"")+" still open", pane=>{
      open.forEach(t=>{
        const r = el("div","task");
        r.innerHTML = '<div class="tbody"><div class="trail">'+esc(t.rail || (taskTimes(t)?taskTimes(t).today:"")) +
                      '</div><div class="tt">'+esc(t.title)+'</div></div>';
        pane.appendChild(r);
      });
      const b1 = el("button","btn","Go back and finish them");
      b1.style.marginTop="16px"; b1.onclick=()=>{ closeSheet(); };
      pane.appendChild(b1);
      const b2 = el("button","btn warn","Complete anyway");
      b2.style.marginTop="8px";
      b2.onclick = ()=>{
        const why = prompt("Why is the shift being completed with tasks open?");
        if(why && why.trim()){ S.overrideReason = why.trim(); persist(); closeSheetNoHistory(); clockOut(); }
        else if(why!==null){ toast("A reason is required"); }
      };
      pane.appendChild(b2);
    });
    return;
  }
  clockOut();
}
function clockOut(){
  alarmGate("set", (at)=>{
    S.alarm = Object.assign({}, S.alarm, { setAt: at.toISOString() });
    persist(); finish();
  });
}
function finish(){
  const p = progress();
  const rec = {
    id:"sh"+Date.now(), date:S.date, staff:S.staff, openedBy:S.openedBy, checkedBy:S.checkedBy,
    startedAt:S.startedAt, completedAt:new Date().toISOString(),
    pct:p.pct, done:p.done, total:p.total,
    tasks: tasks().map(t=>({ id:t.id, title:t.title, rail:t.rail, done:isDone(t.id),
                             at:(S.tasks[t.id]||{}).at||null, initials:(S.tasks[t.id]||{}).initials||"" })),
    subs: Object.assign({}, S.subs),
    actuals: Object.assign({}, S.actuals),
    notes:S.notes, overrideReason:S.overrideReason, alarm:Object.assign({},S.alarm)
  };
  HIST.unshift(rec); HIST = HIST.slice(0,120); save(K.hist, HIST);
  S = BLANK(); persist(); renderTimers();
  go("history"); renderHistory();
  toast("Shift saved to history");
}

function showSplash(){
  try{ navigator.vibrate && navigator.vibrate([22,55,22]); }catch(e){}
  const started = new Date(S.startedAt);
  const nt = nextTask();
  const ntT = nt ? taskTimes(nt) : null;
  const sp = specialToday();
  const bake = CFG.targets.filter(t=>t.group==="bake").slice(0,4);

  const s = el("div","splash");
  s.innerHTML =
    '<img class="ele" src="elephant.png" alt="">' +
    '<h2>Shift<br>started</h2>' +
    '<div class="when">'+esc(fmtClock(started))+' &middot; '+esc(fmtDate(started))+'</div>' +
    (sp ? '<div class="ph">'+esc(sp.name)+' &mdash; extra prep today</div>' : '') +
    '<div class="line"></div>' +
    '<div class="mk">'+ bake.map(t=>

/* =========================================================================
   ALARM GATE — you cannot start or finish the shift without keying the code
   ========================================================================= */
function beep(freq, dur, vol){
  try{
    const C = window.AudioContext||window.webkitAudioContext; if(!C) return;
    const ctx = beep._ctx || (beep._ctx = new C());
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = "sine"; o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(vol||0.12, ctx.currentTime+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime+(dur||0.09));
    o.connect(g); g.connect(ctx.destination); o.start(); o.stop(ctx.currentTime+(dur||0.09)+0.02);
  }catch(e){}
}
function buzz(p){ try{ navigator.vibrate && navigator.vibrate(p); }catch(e){} }

/* mode: "off" (clock in) | "set" (clock out).  onPass() runs once the code is right. */
function alarmGate(mode, onPass){
  const code = String(CFG.alarmCode||"");
  const g = el("div","gate"+(mode==="set"?" arm":""));
  const lockIcon = mode==="off"
    ? '<svg class="lock" viewBox="0 0 24 24"><rect x="3.5" y="11" width="17" height="11" rx="2.5"/><path d="M7.5 11V7a4.5 4.5 0 0 1 9 0"/></svg>'
    : '<svg class="lock" viewBox="0 0 24 24"><rect x="3.5" y="11" width="17" height="11" rx="2.5"/><path d="M7.5 11V7a4.5 4.5 0 0 1 9 0v4"/></svg>';
  g.innerHTML =
    '<div class="gatehead">'+
      lockIcon+
      '<div class="kicker">'+(mode==="off"?"Clock in":"Clock out")+'</div>'+
      '<h2>'+(mode==="off"?"Disarm<br>the alarm":"Set<br>the alarm")+'</h2>'+
      '<div class="sub">'+(mode==="off"
          ? "Key this into the alarm panel, then key it here to start your shift."
          : "Key this into the alarm panel on your way out, then key it here to close the shift.")+'</div>'+
      '<div class="codebox"><div class="cl">The code is</div><div class="cv">'+esc(code)+'</div></div>'+
      '<div class="dots">'+ code.split("").map(()=>'<i></i>').join("") +'</div>'+
      '<div class="err"></div>'+
      '<div class="pad"></div>'+
    '</div>'+
    '<div class="winwrap">'+
      '<svg viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg>'+
      '<div class="wt">'+(mode==="off"?"Alarm off":"Alarm set")+'</div>'+
      '<div class="ws"></div>'+
    '</div>';
  document.body.appendChild(g);

  let entry = "";
  const dots = g.querySelectorAll(".dots i");
  const errEl = g.querySelector(".err");
  const draw = ()=> dots.forEach((d,i)=> d.classList.toggle("on", i < entry.length));

  const pad = g.querySelector(".pad");
  const keys = ["1","2","3","4","5","6","7","8","9","clear","0","back"];
  keys.forEach(k=>{
    const b = el("button", (k==="clear"||k==="back") ? "act" : "", k==="clear" ? "Clear" : k==="back" ? "&larr;" : k);
    b.onclick = ()=>{
      if(k==="clear"){ entry=""; beep(320,.07); }
      else if(k==="back"){ entry = entry.slice(0,-1); beep(320,.07); }
      else if(entry.length < code.length){ entry += k; beep(660+entry.length*60,.07); buzz(9); }
      errEl.textContent = ""; g.classList.remove("bad");
      draw();
      if(entry.length === code.length) setTimeout(check, 130);
    };
    pad.appendChild(b);
  });

  function check(){
    if(entry === code){
      buzz([18,50,18,50,90]);
      beep(660,.11); setTimeout(()=>beep(880,.11),110); setTimeout(()=>beep(1175,.2,.14),220);
      const now = new Date();
      g.querySelector(".winwrap .ws").textContent = fmtClock(now);
      g.classList.add("win");
      setTimeout(()=>{ g.style.transition="opacity .3s"; g.style.opacity="0";
        setTimeout(()=>{ g.remove(); onPass(now); }, 300); }, 1150);
    } else {
      buzz([70,60,70]); beep(180,.22,.16);
      g.classList.add("bad");
      errEl.textContent = "Not that one — try again";
      entry = ""; setTimeout(draw, 380);
    }
  }
}

function openRecipe(id){
  const r = CFG.recipes.find(x=>x.id===id); if(!r) return;
  openSheet(r.name, pane=>{
    let mult = 1;
    if(r.container){
      const cb = el("div","contbar"+(r.container.color?"":" clear"));
      if(r.container.color) cb.style.background = r.container.color;
      cb.innerHTML = (r.container.color?'':swatch(r.container,true))+'<div><div class="k">Goes in the</div><div class="v">'+
        esc(r.container.name)+' tub</div></div>';
      pane.appendChild(cb);
    }
    const tg = CFG.targets.find(x=>x.recipe===r.id);
    const rem = tg ? remainingFor(tg) : null;
    const start = rem ? (rem.lo>0 ? rem.lo : (rem.hi>0 ? rem.hi : r.base.cc)) : r.base.cc;
    const sc = el("div","scaler");
    sc.innerHTML = '<div class="lab">Cream cheese for this batch (kg)</div>'+
      '<div class="rowin"><button class="step" data-d="-1">&minus;</button>'+
      '<input id="scIn" inputmode="decimal" value="'+round(start)+'">'+
      '<button class="step" data-d="1">+</button></div>'+
      (tg ? '<div class="schint">Target <b>'+esc(tg.target)+' kg</b>'+
            (rem && !rem.full ? ' &middot; you have <b>'+esc(round(rem.have))+' kg</b> &middot; still to make <b>'+esc(fmtRange(rem))+' kg</b>' : '')+
            '</div>' : '');
    pane.appendChild(sc);
    const list = el("div","card"); list.style.marginTop="12px"; pane.appendChild(list);
    const foot = el("div"); pane.appendChild(foot);

    function draw(){
      const v = num($("#scIn").value);
      mult = (v && v>0) ? v / r.base.cc : 1;
      list.innerHTML = '<div class="lab" style="font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--mute)">You need</div>' +
        r.ingredients.map(i=>{
          const q = i.scale ? i.qty*mult : i.qty;
          return '<div class="ing"><span class="n">'+esc(i.name)+(i.scale?'':' <em style="font-style:normal;font-size:11px;color:var(--mute)">(not scaled)</em>')+
                 '</span><span class="q">'+esc(round(q))+'<em>'+esc(i.unit)+'</em></span></div>';
        }).join("");
      foot.innerHTML = mult!==1 ? '<div class="hint">Scaled ×'+esc(round(mult))+' from the base batch.</div>' : '';
    }
    sc.querySelectorAll(".step").forEach(btn=>{
      btn.onclick = ()=>{ const i=$("#scIn"); const v=(num(i.value)||0)+ (+btn.dataset.d)*0.5;
        i.value = round(Math.max(0.5, v)); draw(); };
    });
    sc.querySelector("#scIn").oninput = draw;
    draw();

    if(r.notes && r.notes.length){
      const n = el("div","note"); n.innerHTML = '<span class="nh">Note</span>'+r.notes.map(esc).join("<br>");
      pane.appendChild(n);
    }
  });
}

/* =========================================================================
   RECEIPTS
   Photograph a receipt, it is downscaled and stored on the device in
   IndexedDB. Works with no signal — which matters, because a receipt is
   photographed at the counter, not at a desk.
   Export writes a real .zip (store method, no compression — JPEGs are
   already compressed) containing every image plus a receipts.csv.
   ========================================================================= */
const RCPT_STORE = "receipts";

function rdb(){
  return new Promise((res,rej)=>{
    if(!("indexedDB" in window)) return rej(new Error("no idb"));
    const r = indexedDB.open("giant-prep", 2);
    r.onupgradeneeded = ()=>{
      const d = r.result;
      if(!d.objectStoreNames.contains("timers"))   d.createObjectStore("timers",{keyPath:"tid"});
      if(!d.objectStoreNames.contains(RCPT_STORE)) d.createObjectStore(RCPT_STORE,{keyPath:"id"});
    };
    r.onsuccess = ()=>res(r.result); r.onerror = ()=>rej(r.error);
  });
}
function rAll(){ return rdb().then(d=>new Promise((res,rej)=>{
  const q = d.transaction(RCPT_STORE,"readonly").objectStore(RCPT_STORE).getAll();
  q.onsuccess = ()=>res((q.result||[]).sort((a,b)=> b.at.localeCompare(a.at)));
  q.onerror = ()=>rej(q.error); })).catch(()=>[]); }
function rGet(id){ return rdb().then(d=>new Promise((res,rej)=>{
  const q = d.transaction(RCPT_STORE,"readonly").objectStore(RCPT_STORE).get(id);
  q.onsuccess = ()=>res(q.result); q.onerror = ()=>rej(q.error); })).catch(()=>null); }
function rPut(rec){ return rdb().then(d=>new Promise((res,rej)=>{
  const tx = d.transaction(RCPT_STORE,"readwrite"); tx.objectStore(RCPT_STORE).put(rec);
  tx.oncomplete = ()=>res(true); tx.onerror = ()=>rej(tx.error); })); }
function rDel(id){ return rdb().then(d=>new Promise(res=>{
  const tx = d.transaction(RCPT_STORE,"readwrite"); tx.objectStore(RCPT_STORE).delete(id);
  tx.oncomplete = res; tx.onerror = res; })).catch(()=>{}); }

/* ---------- downscale so a shift's receipts don't fill the phone ---------- */
function shrink(file, maxEdge, quality){
  return new Promise((res,rej)=>{
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = ()=>{
      const scale = Math.min(1, maxEdge / Math.max(img.width, img.height));
      const w = Math.round(img.width*scale), h = Math.round(img.height*scale);
      const c = document.createElement("canvas"); c.width=w; c.height=h;
      c.getContext("2d").drawImage(img,0,0,w,h);
      c.toBlob(b=>{
        URL.revokeObjectURL(url);
        if(!b) return rej(new Error("could not read that photo"));
        res({ blob:b, w, h });
      }, "image/jpeg", quality||0.82);
    };
    img.onerror = ()=>{ URL.revokeObjectURL(url); rej(new Error("could not read that photo")); };
    img.src = url;
  });
}
function thumbOf(blob){
  return new Promise(res=>{
    const url = URL.createObjectURL(blob); const img = new Image();
    img.onload = ()=>{
      const s = 150/Math.max(img.width,img.height);
      const c = document.createElement("canvas");
      c.width = Math.round(img.width*s); c.height = Math.round(img.height*s);
      c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(url);
      res(c.toDataURL("image/jpeg",0.6));
    };
    img.onerror = ()=>{ URL.revokeObjectURL(url); res(""); };
    img.src = url;
  });
}

/* ---------- minimal ZIP writer (store method) ---------- */
const CRC_T = (()=>{ const t=new Uint32Array(256);
  for(let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++) c = c&1 ? 0xEDB88320 ^ (c>>>1) : c>>>1; t[n]=c>>>0; }
  return t; })();
function crc32(u8){ let c = 0xFFFFFFFF;
  for(let i=0;i<u8.length;i++) c = CRC_T[(c ^ u8[i]) & 0xFF] ^ (c>>>8);
  return (c ^ 0xFFFFFFFF)>>>0; }
function dosTime(d){
  const t = ((d.getHours()&31)<<11) | ((d.getMinutes()&63)<<5) | ((d.getSeconds()/2)&31);
  const dt = (((d.getFullYear()-1980)&127)<<9) | (((d.getMonth()+1)&15)<<5) | (d.getDate()&31);
  return { t, dt };
}
async function makeZip(entries){           // [{name, data:Uint8Array, date}]
  const chunks = [], central = []; let offset = 0;
  const enc = new TextEncoder();
  for(const e of entries){
    const name = enc.encode(e.name);
    const crc = crc32(e.data);
    const { t, dt } = dosTime(e.date || new Date());
    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(6, 0, true);
    lh.setUint16(8, 0, true); lh.setUint16(10, t, true); lh.setUint16(12, dt, true);
    lh.setUint32(14, crc, true); lh.setUint32(18, e.data.length, true); lh.setUint32(22, e.data.length, true);
    lh.setUint16(26, name.length, true); lh.setUint16(28, 0, true);
    chunks.push(new Uint8Array(lh.buffer), name, e.data);

    const ch = new DataView(new ArrayBuffer(46));
    ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true);
    ch.setUint16(8, 0, true); ch.setUint16(10, 0, true); ch.setUint16(12, t, true); ch.setUint16(14, dt, true);
    ch.setUint32(16, crc, true); ch.setUint32(20, e.data.length, true); ch.setUint32(24, e.data.length, true);
    ch.setUint16(28, name.length, true); ch.setUint16(30, 0, true); ch.setUint16(32, 0, true);
    ch.setUint16(34, 0, true); ch.setUint16(36, 0, true); ch.setUint32(38, 0, true);
    ch.setUint32(42, offset, true);
    central.push(new Uint8Array(ch.buffer), name);
    offset += 30 + name.length + e.data.length;
  }
  let cdSize = 0; central.forEach(c=> cdSize += c.length);
  const eo = new DataView(new ArrayBuffer(22));
  eo.setUint32(0, 0x06054b50, true); eo.setUint16(4,0,true); eo.setUint16(6,0,true);
  eo.setUint16(8, entries.length, true); eo.setUint16(10, entries.length, true);
  eo.setUint32(12, cdSize, true); eo.setUint32(16, offset, true); eo.setUint16(20, 0, true);
  return new Blob([...chunks, ...central, new Uint8Array(eo.buffer)], { type:"application/zip" });
}

/* ---------- helpers ---------- */
const money = n => (n==null||n==="") ? "" : "$"+Number(n).toFixed(2);
const monthKey = iso => iso.slice(0,7);
const monthName = k => { const [y,m] = k.split("-");
  return new Date(+y, +m-1, 1).toLocaleDateString(undefined,{month:"long",year:"numeric"}).toUpperCase(); };
function saveBlob(blob, filename){
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename; document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(url); a.remove(); }, 4000);
}
const isIOS = ()=> /iPad|iPhone|iPod/.test(navigator.userAgent) ||
  (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);

/* ---------- screen ---------- */
let RCPTS = [];
async function renderReceipts(){
  const b = $("#receiptsBody"); b.innerHTML = "";
  RCPTS = await rAll();

  zone(b,"Receipts", RCPTS.length ? RCPTS.length+" saved" : "");

  /* capture */
  const cap = el("div");
  cap.innerHTML = '<input type="file" accept="image/*" capture="environment" id="rcptIn" hidden>';
  const shoot = el("button","btn",
    '<svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" '+
    'stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>'+
    '<circle cx="12" cy="13" r="4"/></svg> Photograph a receipt');
  shoot.onclick = ()=> cap.querySelector("#rcptIn").click();
  cap.appendChild(shoot);
  const pick = el("button","btn alt sm","Choose from photos");
  pick.style.marginTop = "8px";
  pick.onclick = ()=>{ const i = cap.querySelector("#rcptIn"); i.removeAttribute("capture"); i.click();
    setTimeout(()=>i.setAttribute("capture","environment"), 1500); };
  cap.appendChild(pick);
  b.appendChild(cap);
  cap.querySelector("#rcptIn").onchange = async e=>{
    const f = e.target.files && e.target.files[0]; e.target.value = "";
    if(!f) return;
    toast("Saving…");
    try{
      const { blob, w, h } = await shrink(f, 1600, 0.82);
      const thumb = await thumbOf(blob);
      const rec = { id:"r"+Date.now()+Math.random().toString(36).slice(2,7),
                    at:new Date().toISOString(), supplier:"", amount:"", note:"",
                    blob, thumb, w, h, bytes:blob.size, exported:false };
      await rPut(rec);
      buzz(16);
      await renderReceipts();
      openReceipt(rec.id, true);
    }catch(err){ toast(err.message || "Couldn't save that photo"); }
  };

  if(!RCPTS.length){
    b.appendChild(el("div","empty",'<div class="big">No receipts yet</div>'+
      '<div style="margin-top:8px;font-size:13.5px">Photograph one at the counter — it saves straight away, even with no signal.</div>'));
    return;
  }

  /* nudge if nothing has been exported */
  const unexported = RCPTS.filter(r=>!r.exported).length;
  if(unexported){
    const n = el("div","note");
    n.innerHTML = '<span class="nh">'+unexported+' not backed up</span>These live on this phone only. '+
      'Export them to your Mac every so often — if the phone is lost or its data is cleared, they go with it.';
    b.appendChild(n);
  }

  /* group by month */
  const months = {};
  RCPTS.forEach(r=>{ (months[monthKey(r.at)] = months[monthKey(r.at)] || []).push(r); });

  Object.keys(months).sort().reverse().forEach(mk=>{
    const list = months[mk];
    const total = list.reduce((s,r)=> s + (parseFloat(r.amount)||0), 0);
    const head = el("div","zone");
    head.innerHTML = '<span>'+esc(monthName(mk))+'</span>'+
      (total>0 ? '<em>'+esc(money(total))+' &middot; '+list.length+'</em>' : '<em>'+list.length+'</em>');
    b.appendChild(head);

    const grid = el("div","rgrid");
    list.forEach(r=>{
      const c = el("button","rcpt");
      c.innerHTML = '<img src="'+(r.thumb||"")+'" alt="">'+
        '<div class="rmeta"><div class="rs">'+esc(r.supplier || "No supplier")+'</div>'+
        '<div class="rd">'+esc(new Date(r.at).toLocaleDateString(undefined,{day:"numeric",month:"short"}))+
        (r.exported?' · saved':'')+'</div></div>'+
        '<div class="ra">'+esc(money(r.amount))+'</div>';
      c.onclick = ()=> openReceipt(r.id);
      grid.appendChild(c);
    });
    b.appendChild(grid);

    const ex = el("button","btn alt sm","Export "+monthName(mk).split(" ")[0]+" as .zip");
    ex.style.marginTop = "10px";
    ex.onclick = ()=> exportZip(list, "giant-receipts-"+mk);
    b.appendChild(ex);
  });

  if(RCPTS.length > 1){
    const all = el("button","btn dark","Export everything as .zip");
    all.style.marginTop = "18px";
    all.onclick = ()=> exportZip(RCPTS, "giant-receipts-all");
    b.appendChild(all);
  }
}

async function exportZip(list, base){
  toast("Building zip…");
  try{
    const entries = [];
    const rows = [["date","time","supplier","amount","note","file"]];
    for(const meta of list){
      const full = await rGet(meta.id);
      if(!full || !full.blob) continue;
      const d = new Date(full.at);
      const stamp = full.at.slice(0,10) + "_" + full.at.slice(11,16).replace(":","");
      const name = "receipts/" + stamp + "_" + (full.supplier || "receipt").replace(/[^A-Za-z0-9]+/g,"-").slice(0,28) + ".jpg";
      entries.push({ name, data:new Uint8Array(await full.blob.arrayBuffer()), date:d });
      rows.push([full.at.slice(0,10), full.at.slice(11,16), full.supplier||"", full.amount||"", (full.note||"").replace(/"/g,"'"), name]);
    }
    if(!entries.length){ toast("Nothing to export"); return; }
    const csv = rows.map(r=> r.map(v=>'"'+String(v)+'"').join(",")).join("\r\n");
    entries.push({ name:"receipts.csv", data:new TextEncoder().encode(csv), date:new Date() });
    const zip = await makeZip(entries);
    saveBlob(zip, base + ".zip");
    for(const meta of list){ const f = await rGet(meta.id); if(f){ f.exported = true; await rPut(f); } }
    toast("Exported " + (entries.length-1) + " receipts");
    renderReceipts();
  }catch(e){ toast("Export failed: " + (e.message||e)); }
}

async function openReceipt(id, isNew){
  const r = await rGet(id); if(!r) return;
  const url = URL.createObjectURL(r.blob);
  openSheet(isNew ? "Receipt saved" : "Receipt", pane=>{
    const img = el("div","rfull");
    img.innerHTML = '<img src="'+url+'" alt="Receipt">';
    pane.appendChild(img);

    const f = el("div","card"); f.style.marginTop="12px";
    f.innerHTML = '<div class="fgrid" style="margin-top:0">'+
      '<div class="f full"><label>Supplier</label><input id="rSup" value="'+esc(r.supplier||"")+'" placeholder="Who did you buy from?"></div>'+
      '<div class="f"><label>Amount ($)</label><input id="rAmt" inputmode="decimal" value="'+esc(r.amount||"")+'" placeholder="0.00"></div>'+
      '<div class="f"><label>Date</label><input value="'+esc(new Date(r.at).toLocaleDateString())+'" disabled></div>'+
      '<div class="f full"><label>Note</label><input id="rNote" value="'+esc(r.note||"")+'" placeholder="What was it for?"></div>'+
      '</div>';
    pane.appendChild(f);
    let saveT;
    const save = async ()=>{
      const cur = await rGet(id); if(!cur) return;
      cur.supplier = f.querySelector("#rSup").value.trim();
      cur.amount   = f.querySelector("#rAmt").value.trim();
      cur.note     = f.querySelector("#rNote").value.trim();
      await rPut(cur);
      clearTimeout(saveT);
      saveT = setTimeout(()=>{ if($("#sc-receipts").classList.contains("on")) renderReceipts(); }, 500);
    };
    f.querySelectorAll("input").forEach(i=>{ i.oninput = save; });

    const dl = el("button","btn","Download this receipt");
    dl.style.marginTop = "14px";
    dl.onclick = async ()=>{
      const cur = await rGet(id);
      const stamp = cur.at.slice(0,10);
      saveBlob(cur.blob, stamp + "_" + (cur.supplier||"receipt").replace(/[^A-Za-z0-9]+/g,"-") + ".jpg");
      cur.exported = true; await rPut(cur);
    };
    pane.appendChild(dl);

    if(isIOS()){
      const h = el("div","hint");
      h.innerHTML = "On iPhone, press and hold the photo above and choose <b>Save to Photos</b> — that is the reliable way to get a single receipt into your camera roll. The zip export works properly on your Mac.";
      pane.appendChild(h);
    }

    const del = el("button","btn alt sm","Delete this receipt");
    del.style.marginTop = "10px";
    del.onclick = async ()=>{
      if(!confirm("Delete this receipt? It cannot be recovered.")) return;
      await rDel(id); closeSheet(); renderReceipts();
    };
    pane.appendChild(del);
  });
}

  });
}

let sheetPushed = false;
function openSheet(title, build){
  $("#sheetTitle").textContent = title;
  const body = $("#sheetBody"); body.innerHTML=""; build(body);
  /* big back button at the bottom too — easier to hit than the header */
  const bb = el("button","btn alt backbig");
  bb.innerHTML = '<span style="font-size:20px">&larr;</span> Back';
  bb.onclick = closeSheet;
  body.appendChild(bb);
  $("#sheet").classList.add("on"); document.body.style.overflow="hidden";
  if(!sheetPushed){ try{ history.pushState({sheet:true},""); sheetPushed=true; }catch(e){} }
}
function closeSheet(){
  $("#sheet").classList.remove("on"); document.body.style.overflow="";
  if(sheetPushed){ sheetPushed=false; try{ history.back(); }catch(e){} }
}
function closeSheetNoHistory(){
  $("#sheet").classList.remove("on"); document.body.style.overflow=""; sheetPushed=false;
}
window.addEventListener("popstate", ()=>{ if($("#sheet").classList.contains("on")) closeSheetNoHistory(); });
$("#sheetClose").onclick = closeSheet;
$("#sheetBack").onclick = closeSheet;
$("#sheet").onclick = e=>{ if(e.target.id==="sheet") closeSheet(); };

function go(scr){
  document.querySelectorAll(".screen").forEach(s=>s.classList.remove("on"));
  $("#sc-"+scr).classList.add("on");
  document.querySelectorAll("nav.bn button").forEach(b=>b.classList.toggle("on", b.dataset.scr===scr));
  if(scr==="guide") renderGuide();
  if(scr==="recipes") renderRecipes();
  if(scr==="calc") renderCalc();
  if(scr==="history") renderHistory();
  if(scr==="receipts") renderReceipts();
  if(scr==="today") renderToday();
  window.scrollTo(0,0);
}
document.querySelectorAll("nav.bn button").forEach(b=> b.onclick = ()=> go(b.dataset.scr));

function renderAll(){ renderToday(); renderTimers(); }

function netState(){ $("#offlineBar").classList.toggle("on", !navigator.onLine); }
window.addEventListener("online", netState); window.addEventListener("offline", netState);

netState(); renderAll();
window.GIANT = { go, selectCalc };
})();
